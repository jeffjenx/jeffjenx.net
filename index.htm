  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--jj-font-body);
      font-size: var(--jj-text-base);
      line-height: var(--jj-leading-normal);
      color: var(--jj-fg);
      background-color: var(--jj-bg);
      transition: background-color 160ms ease, color 160ms ease;
      padding: 0;
    }

    .container {
      max-width: var(--jj-width-wide);
      margin: 0 auto;
      padding: var(--jj-space-6) var(--jj-space-4);
    }

    /* --- NAV --- */
    .jj-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: color-mix(in srgb, var(--jj-bg) 92%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--jj-border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: nowrap;
    }

    .jj-lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--jj-fg);
    }

    .jj-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: var(--jj-fg);
      color: var(--jj-bg);
      font-family: var(--jj-font-mono);
      font-weight: 500;
      font-size: 14px;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }

    .jj-lockup-text {
      display: flex;
      flex-direction: column;
    }

    .jj-lockup-name {
      font-family: var(--jj-font-mono);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .jj-lockup-sub {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--jj-fg-subtle);
    }

    .jj-nav-links {
      display: flex;
      gap: 18px;
      list-style: none;
      flex-wrap: wrap;
    }

    .jj-nav-link {
      font-family: var(--jj-font-mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      color: var(--jj-fg-muted);
      text-decoration: none;
    }

    .jj-nav-link:hover { color: var(--jj-fg); opacity: 1; }

    .jj-nav-link[aria-current="page"] {
      color: var(--jj-fg);
      font-weight: 500;
    }

    #theme-toggle {
      font-family: var(--jj-font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none;
      border: 1px solid var(--jj-border-color);
      color: var(--jj-fg-muted);
      padding: 5px 11px;
      cursor: pointer;
    }

    #theme-toggle:hover { background: var(--jj-bg-sunken); }

    /* --- SECTION --- */
    .section {
      margin-bottom: var(--jj-space-10);
    }

    .section__header {
      display: flex;
      align-items: center;
      gap: var(--jj-space-3);
      margin-bottom: var(--jj-space-6);
      padding-bottom: var(--jj-space-3);
      border-bottom: var(--jj-border);
    }

    .section__icon {
      display: none;
    }

    .section__title {
      font-family: var(--jj-font-mono);
      font-size: var(--jj-text-sm);
      font-weight: var(--jj-weight-medium);
      letter-spacing: var(--jj-tracking-wider);
      text-transform: uppercase;
      color: var(--jj-fg-muted);
    }

    /* --- LINK GRID --- */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--jj-space-4);
    }

    .link-card {
      display: block;
      padding: var(--jj-space-4);
      background-color: var(--jj-bg-raised);
      border: var(--jj-border);
      border-radius: 0;
      text-decoration: none;
      color: var(--jj-fg);
      transition: transform var(--jj-duration-fast) var(--jj-ease),
                  box-shadow var(--jj-duration-fast) var(--jj-ease),
                  border-color var(--jj-duration-fast) var(--jj-ease);
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background-color: var(--jj-accent);
      opacity: 0;
      transition: opacity var(--jj-duration-fast) var(--jj-ease);
    }

    .link-card:hover {
      border-color: var(--jj-accent, var(--jj-fg));
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-card__name {
      font-family: var(--jj-font-mono);
      font-size: var(--jj-text-base);
      font-weight: var(--jj-weight-medium);
      margin-bottom: var(--jj-space-2);
      display: flex;
      align-items: center;
      gap: var(--jj-space-2);
    }

    .link-card__domain {
      font-size: var(--jj-text-xs);
      color: var(--jj-fg-subtle);
      letter-spacing: var(--jj-tracking-wide);
    }

    .link-card__desc {
      font-size: var(--jj-text-sm);
      color: var(--jj-fg-muted);
      line-height: var(--jj-leading-snug);
      margin-top: var(--jj-space-2);
    }

    /* --- FOOTER --- */
    .jj-footer {
      border-top: 1px solid var(--jj-border-color);
      padding: 28px 0;
      color: var(--jj-fg-subtle);
      font-family: var(--jj-font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .jj-footer a {
      color: var(--jj-fg-subtle);
      text-decoration: none;
      border-bottom: 1px solid var(--jj-border-color);
    }

    .jj-footer a:hover {
      color: var(--jj-fg);
      border-bottom-color: var(--jj-fg);
    }

    .jj-footer-row + .jj-footer-row { margin-top: 8px; }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      .link-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: var(--jj-space-4) var(--jj-space-3);
      }
    }

    @media (max-width: 520px) {
      .jj-nav-links {
        display: none;
      }
    }
  </style>
</head>

  <script>
    const linksData = [
      { url: 'jeffjenx.com', category: 'personal', name: '[JJ] Commercial', desc: 'The Jeff Jenx shop — developer apparel, retro computing shirts, and digital goods' },
      { url: 'jeffjenx.design', category: 'personal', name: '[JJ] Design', desc: 'Design system, brand strategy, and visual language' },
      { url: 'jeffjenx.net', category: 'personal', name: '[JJ] Network', desc: 'Network hub, connected services, and links' },
      { url: 'facebook.com/jeffjenx.me', category: 'social', name: 'Facebook', desc: 'Community updates, events, and discussions' },
      { url: 'github.com/jeffjenx', category: 'dev', name: 'GitHub', desc: 'Open source projects, repositories, and code' },
      { url: 'github.com/jeffjenx/home.gb', category: 'dev', name: 'Home — Game Boy ROM', desc: 'A custom system menu ROM for Game Boy flash cartridges. Browse, search, favorites, label art.' },
      { url: 'instagram.com/jeffjenx.jpg', category: 'social', name: 'Instagram', desc: 'Visual updates, behind-the-scenes content' },
      { url: 'linkedin.com/in/jeffjenx', category: 'social', name: 'LinkedIn', desc: 'Professional network and career updates' },
      { url: 'stackoverflow.com/users/1028949/jeffjenx', category: 'dev', name: 'Stack Overflow', desc: 'Technical Q&A and community contributions' },
      { url: 'twitch.tv/jeffjenx', category: 'gaming', name: 'Twitch', desc: 'Live streaming, gameplay, and interactive sessions' },
      { url: 'x.com/jeff_jenx', category: 'social', name: 'X (Twitter)', desc: 'Quick updates, thoughts, and engagement' },
      { url: 'account.xbox.com/en-us/profile?gamertag=jeffjenx', category: 'gaming', name: 'Xbox Profile', desc: 'Gamer profile, achievements, and activity' },
      { url: 'jeffjenx.com', category: 'shop', name: 'Jeff Jenx Shop', desc: 'Official Jeff Jenx merchandise — developer shirts, retro computing apparel, and digital downloads' },
      { url: 'zazzle.com/store/jeffjenx', category: 'shop', name: 'Zazzle Store', desc: 'Custom merchandise, apparel, and accessories' },
      { url: 'jeffjenx.redbubble.com', category: 'shop', name: 'Redbubble', desc: 'Independent designs, prints, and creative goods' },
      { url: 'jeffjenx.gumroad.com', category: 'shop', name: 'Gumroad', desc: 'Digital downloads — ROMs, design tokens, templates, and brand assets' },
      { url: 'profile.playstation.com/jeffjenx', category: 'gaming', name: 'PlayStation Profile', desc: 'PSN profile, trophies, and activity' }
    ];

    function createLinkCard(link) {
      const card = document.createElement('a');
      card.className = 'link-card';
      card.href = `https://${link.url}`;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      const domain = link.url.split('/')[0];

      card.innerHTML = `
        <div class="link-card__name">${link.name}</div>
        <div class="link-card__domain">${domain}</div>
        <div class="link-card__desc">${link.desc}</div>
      `;

      return card;
    }

    function populateLinks() {
      const containers = {
        personal: document.getElementById('personal-links'),
        gaming: document.getElementById('gaming-links'),
        social: document.getElementById('social-links'),
        dev: document.getElementById('dev-links'),
        shop: document.getElementById('shop-links')
      };

      linksData.forEach(link => {
        if (containers[link.category]) {
          containers[link.category].appendChild(createLinkCard(link));
        }
      });
    }

    populateLinks();
  </script>
<script>
(() => {
  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)');
  const saved = (() => { try { return localStorage.getItem('jj-theme'); } catch(e) { return null; } })();
  const override = (() => { try { return localStorage.getItem('jj-theme-override') === 'true'; } catch(e) { return false; } })();
  let theme = (override && saved) ? saved : (sysDark.matches ? 'dark' : 'light');
  root.setAttribute('data-theme', theme);
  toggle.textContent = theme === 'dark' ? 'Light' : 'Dark';
  toggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('jj-theme', next); localStorage.setItem('jj-theme-override', 'true'); } catch(e) {}
    toggle.textContent = next === 'dark' ? 'Light' : 'Dark';
  });
  sysDark.addEventListener('change', (e) => {
    if (!override) {
      const t = e.matches ? 'dark' : 'light';
      root.setAttribute('data-theme', t);
      toggle.textContent = t === 'dark' ? 'Light' : 'Dark';
    }
  });
})();
</script>
